name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to enable Pages and publish to it.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true turns GitHub Pages on automatically (no manual settings step).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the app files (keep .git, tools/, serve.js, CI out of the site).
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
